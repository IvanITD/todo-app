<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Todo App</title>
        <link rel="stylesheet" href="assets/css/style.css">
        <script src="assets/js/script.js" defer></script>
    </head>
    <body>
        <main>
            <header>
                <div id="theme-toggle" role="button" tabindex="0" aria-label="Switch to dark theme">
                    <span class="theme-toggle-sun" aria-hidden="true">
                        <svg viewBox="0 0 24 24" focusable="false">
                            <g fill="currentColor" transform="translate(12 12)">
                                <circle r="3.8"></circle>
                                <rect x="-1" y="-11" width="2" height="3.5" rx="0.35"></rect>
                                <rect x="-1" y="-11" width="2" height="3.5" rx="0.35" transform="rotate(45)"></rect>
                                <rect x="-1" y="-11" width="2" height="3.5" rx="0.35" transform="rotate(90)"></rect>
                                <rect x="-1" y="-11" width="2" height="3.5" rx="0.35" transform="rotate(135)"></rect>
                                <rect x="-1" y="-11" width="2" height="3.5" rx="0.35" transform="rotate(180)"></rect>
                                <rect x="-1" y="-11" width="2" height="3.5" rx="0.35" transform="rotate(225)"></rect>
                                <rect x="-1" y="-11" width="2" height="3.5" rx="0.35" transform="rotate(270)"></rect>
                                <rect x="-1" y="-11" width="2" height="3.5" rx="0.35" transform="rotate(315)"></rect>
                            </g>
                        </svg>
                    </span>
                    <span class="theme-toggle-knob" aria-hidden="true"></span>
                    <span class="theme-toggle-moon" aria-hidden="true"></span>
                </div>
                <h1>My Todo List</h1>
                <p class="subtitle">Stay on top of your day</p>
            </header>
            <form id="todo-form">
                <input aria-label="Add todo item" id="todo-input" type="text" placeholder="Add todo item">
                <button id="todo-add" type="submit">Add</button>
            </form>
            <div id="todo-tools">
                <div class="todo-search-wrap">
                    <input aria-label="Search todos" id="todo-search" type="search" placeholder="Search todos">
                    <span class="todo-search-icon" aria-hidden="true"></span>
                    <button type="button" class="todo-search-clear" aria-label="Clear search"></button>
                </div>
                <div id="todo-tools-row">
                    <label for="todo-search-in">Search in</label>
                    <select aria-label="Search in" id="todo-search-in">
                        <option value="all">All lists</option>
                        <option value="active">Active</option>
                        <option value="completed">Completed</option>
                        <option value="bin">Bin</option>
                    </select>
                    <label for="todo-sort">Sort</label>
                    <select aria-label="Sort todos" id="todo-sort">
                        <option value="created">Date added</option>
                        <option value="due">Due date</option>
                        <option value="priority">Priority</option>
                    </select>
                    <label for="todo-tag-filter">Tag</label>
                    <select aria-label="Filter by tag" id="todo-tag-filter">
                        <option value="all">All tags</option>
                        <option value="work">Work</option>
                        <option value="home">Home</option>
                        <option value="personal">Personal</option>
                    </select>
                </div>
            </div>
            <p id="todo-empty" class="empty-message" hidden>No todos yet. Add one above.</p>
            <ul id="todo-list">
            </ul>
            
            <div id="completed-todo-container-checkbox">
                <input aria-label="Show completed todos" type="checkbox" id="completed-todo-checkbox">
                <label for="completed-todo-checkbox">Show Completed Todos</label>
            </div>
            <div id="completed-todo-list-container">
                <div id="completed-actions">
                    <button type="button" id="completed-bin-all">Move all to Bin</button>
                </div>
                <p id="completed-empty" class="empty-message" hidden>No completed todos.</p>
              <ul id="completed-todo-list">
              </ul>
            </div>
            <div id="bin-container-checkbox">
                <input aria-label="Show bin" type="checkbox" id="bin-checkbox">
                <label for="bin-checkbox">Bin</label>
            </div>
            <div id="bin-list-container">
                <div id="bin-actions">
                    <button type="button" id="bin-restore-all">Restore All</button>
                    <button type="button" id="bin-empty-all">Empty bin</button>
                </div>
                <div id="bin-confirm" hidden>
                    <p>Permanently delete everything in the bin? This cannot be undone.</p>
                    <button type="button" id="bin-confirm-cancel">Cancel</button>
                    <button type="button" id="bin-confirm-empty">Empty bin</button>
                </div>
                <p id="bin-empty" class="empty-message" hidden>Bin is empty.</p>
                <ul id="bin-list">
                </ul>
            </div>
        </main>
        <div id="task-editor" hidden>
            <div id="task-editor-backdrop"></div>
            <div id="task-editor-panel" role="dialog" aria-labelledby="task-editor-heading">
                <button type="button" id="task-editor-close" aria-label="Close task editor">Close</button>
                <h2 id="task-editor-heading">Edit Task</h2>

                <label for="task-editor-title">Task name</label>
                <input id="task-editor-title" type="text">

                <label for="task-editor-notes">Notes</label>
                <textarea id="task-editor-notes" rows="5"></textarea>

                <label for="task-editor-due">Due date</label>
                <input id="task-editor-due" type="date">

                <label for="task-editor-priority">Priority</label>
                <select id="task-editor-priority">
                    <option value="none">None</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
                <label for="task-editor-tag">Tag</label>
                <select id="task-editor-tag">
                    <option value="none">None</option>
                    <option value="work">Work</option>
                    <option value="home">Home</option>
                    <option value="personal">Personal</option>
                </select>
                <div id="task-editor-subtasks-block">
                    <div id="task-editor-subtasks-head">
                        <p id="task-editor-subtasks-heading">Subtasks</p>
                        <p id="task-editor-subtasks-count"><span id="task-editor-subtasks-done">0</span> of <span id="task-editor-subtasks-total">0</span></p>
                    </div>
                    <div id="task-editor-subtasks-progress" aria-hidden="true">
                        <div id="task-editor-subtasks-progress-fill"></div>
                    </div>
                    <ul id="task-editor-subtasks">
                    </ul>
                    <input aria-label="Add subtask" id="task-editor-subtask-input" type="text" placeholder="Add subtask">
                    <button type="button" id="task-editor-subtask-add">Add</button>
                </div>
                <p id="task-editor-created-wrap">Created: <span id="task-editor-created"></span></p>
                
                <label for="task-editor-done">
                    <input type="checkbox" id="task-editor-done">
                    Completed
                </label>
            </div>
        </div>
    </body>
</html>
