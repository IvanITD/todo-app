<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Todo App</title>
        <link rel="stylesheet" href="assets/css/style.css">
        <script src="assets/js/script.js" defer></script>
    </head>
    <body>
        <main>
            <header>
                <button type="button" id="theme-toggle" aria-label="Switch to dark theme">Dark</button>
                <h1>My Todo List</h1>
                <p class="subtitle">Stay on top of your day</p>
            </header>
            <form id="todo-form">
                <input aria-label="Add todo item" id="todo-input" type="text" placeholder="Add todo item">
                <button id="todo-add" type="submit">Add</button>
            </form>
            <input aria-label="Search todos" id="todo-search" type="search" placeholder="Search todos">
            <p id="todo-empty" class="empty-message" hidden>No todos yet. Add one above.</p>
            <ul id="todo-list">
            </ul>
            
            <div id="completed-todo-container-checkbox">
                <input aria-label="Show completed todos" type="checkbox" id="completed-todo-checkbox">
                <label for="completed-todo-checkbox">Show Completed Todos</label>
            </div>
            <div id="completed-todo-list-container">
                <p id="completed-empty" class="empty-message" hidden>No completed todos.</p>
              <ul id="completed-todo-list">
              </ul>
            </div>
            <div id="bin-container-checkbox">
                <input aria-label="Show bin" type="checkbox" id="bin-checkbox">
                <label for="bin-checkbox">Bin</label>
            </div>
            <div id="bin-list-container">
                <div id="bin-actions">
                    <button type="button" id="bin-restore-all">Restore All</button>
                    <button type="button" id="bin-empty-all">Empty bin</button>
                </div>
                <div id="bin-confirm" hidden>
                    <p>Permanently delete everything in the bin? This cannot be undone.</p>
                    <button type="button" id="bin-confirm-cancel">Cancel</button>
                    <button type="button" id="bin-confirm-empty">Empty bin</button>
                </div>
                <p id="bin-empty" class="empty-message" hidden>Bin is empty.</p>
                <ul id="bin-list">
                </ul>
            </div>
        </main>
        <div id="task-editor" hidden>
            <div id="task-editor-backdrop"></div>
            <div id="task-editor-panel" role="dialog" aria-labelledby="task-editor-heading">
                <button type="button" id="task-editor-close" aria-label="Close task editor">Close</button>
                <h2 id="task-editor-heading">Edit Task</h2>

                <label for="task-editor-title">Task name</label>
                <input id="task-editor-title" type="text">

                <label for="task-editor-notes">Notes</label>
                <textarea id="task-editor-notes" rows="5"></textarea>

                <label for="task-editor-due">Due date</label>
                <input id="task-editor-due" type="date">

                <label for="task-editor-priority">Priority</label>
                <select id="task-editor-priority">
                    <option value="none">None</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>

                <p id="task-editor-created-wrap">Created: <span id="task-editor-created"></span></p>
                
                <label for="task-editor-done">
                    <input type="checkbox" id="task-editor-done">
                    Completed
                </label>
            </div>
        </div>
    </body>
</html>
